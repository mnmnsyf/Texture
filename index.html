<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mesh Generation Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: [
                "-apple-system",
                "BlinkMacSystemFont",
                "Inter",
                "SF Pro Display",
                "SF Pro Text",
                "Segoe UI",
                "system-ui",
                "sans-serif",
              ],
            },
            colors: {
              appleBlack: "#1D1D1F",
              appleGray: "#86868B",
              appleBg: "#F5F5F7",
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="styles.css?v=apple-gallery-4" />
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  </head>
  <body class="min-h-screen overflow-x-hidden bg-[#F5F5F7] text-[#1D1D1F] antialiased selection:bg-neutral-900 selection:text-white">
    <header class="site-shell site-header">
      <div class="hero-copy">
        <p class="hero-eyebrow">
          Kinematic Texture Benchmark
        </p>
        <h1 id="page-title" class="hero-title">
          Mesh Generation Gallery
        </h1>
        <p id="page-subtitle" class="hero-subtitle">
          Texture benchmark outputs collected from this repository.
        </p>
      </div>

      <section id="stats" class="stats-panel" aria-label="Gallery summary"></section>
    </header>

    <main class="site-shell page-main">
      <section id="gallery" class="space-y-4 lg:space-y-5" aria-label="Mesh generation benchmark cases"></section>
    </main>

    <dialog id="asset-dialog" class="asset-dialog rounded-[2rem] bg-transparent p-0 text-[#1D1D1F] backdrop:bg-black/30">
      <form method="dialog" class="dialog-frame overflow-hidden rounded-[2rem] border border-neutral-200/70 bg-[#F5F5F7] shadow-2xl shadow-black/10">
        <div class="flex items-start justify-between gap-6 border-b border-neutral-200/70 bg-white/80 px-6 py-5 backdrop-blur-xl">
          <div>
            <p id="dialog-kicker" class="text-xs font-semibold uppercase tracking-[0.2em] text-[#86868B]"></p>
            <h2 id="dialog-title" class="mt-1 text-2xl font-semibold tracking-[-0.025em] text-[#1D1D1F]"></h2>
          </div>
          <button
            class="inline-flex h-10 w-10 items-center justify-center rounded-full bg-neutral-200/80 text-neutral-700 transition-all duration-300 ease-out hover:bg-neutral-300 hover:text-black"
            value="close"
            aria-label="Close preview"
            title="Close preview"
          >
            <i data-lucide="x" class="h-5 w-5" aria-hidden="true"></i>
          </button>
        </div>
        <div id="dialog-stage" class="grid min-h-[60vh] place-items-center bg-neutral-100"></div>
        <div id="dialog-links" class="flex flex-wrap gap-2 border-t border-neutral-200/70 bg-white/75 px-6 py-4"></div>
      </form>
    </dialog>

    <script src="data/results.js?v=apple-gallery-4"></script>
    <script src="app.js?v=apple-gallery-4"></script>
  </body>
</html>
