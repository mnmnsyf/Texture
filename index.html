<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mesh Generation Gallery</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="title-block">
        <p class="eyebrow">Kinematic Texture Benchmark</p>
        <h1 id="page-title">Mesh Generation Gallery</h1>
        <p id="page-subtitle">Texture benchmark outputs collected from this repository.</p>
      </div>
      <div class="summary-strip" aria-label="Gallery summary">
        <div>
          <span id="case-count">0</span>
          <small>cases</small>
        </div>
        <div>
          <span id="method-count">0</span>
          <small>methods</small>
        </div>
        <div>
          <span id="asset-count">0</span>
          <small>assets</small>
        </div>
      </div>
    </header>

    <main>
      <section class="gallery-shell" aria-label="Mesh result table">
        <div id="gallery-table" class="gallery-table"></div>
      </section>
    </main>

    <dialog id="asset-dialog" class="asset-dialog" aria-labelledby="dialog-title">
      <form method="dialog" class="dialog-frame">
        <div class="dialog-topbar">
          <div>
            <p id="dialog-kicker" class="dialog-kicker"></p>
            <h2 id="dialog-title"></h2>
          </div>
          <button class="icon-button" value="close" aria-label="Close preview" title="Close preview">
            <i data-lucide="x" aria-hidden="true"></i>
          </button>
        </div>
        <div id="dialog-stage" class="dialog-stage"></div>
        <div id="dialog-links" class="dialog-links"></div>
      </form>
    </dialog>

    <script src="data/results.js"></script>
    <script src="app.js"></script>
  </body>
</html>
